[package]
name = "brc20-index"
version = "2.0.14"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
axum-server = "0.8.0"
base64 = "0.22.1"
bitcoin = "0.32.102"
brc20-prog = { version = "0.16.0", default-features = false }
db_reader = { path = "../../ord/db_reader", default-features = false }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonrpsee = { version = "0.26.1", features = ["client", "http-client", "tokio"] }
lazy_static = "1.5.1"
num-traits = "0.2.19"
once_cell = "1.21.4"
opi-core = { path = "../../opi-indexer/crates/opi-core" }
rand = "0.9.2"
reqwest = { version = "0.13.5", features = ["json"] }
rust-embed = "8.13.0"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
serde_with = "3.24.0"
sha256 = "1.6.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "bigdecimal", "time", "tls-rustls"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
versions = "7.0.0"

[dev-dependencies]
anyhow = "1"
