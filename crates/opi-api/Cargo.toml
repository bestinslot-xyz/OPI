[package]
name = "opi-api"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8.9"
dotenvy = "0.15"
futures = "0.3"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server-graceful", "tokio"] }
jiff = "0.2"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
