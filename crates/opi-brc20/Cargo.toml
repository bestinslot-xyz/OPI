[package]
name = "opi-brc20"
version = "2.0.14"
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
axum = "0.8.9"
axum-server = "0.8.0"
bitcoin = "0.32.102"
brc20-prog = "0.16.5"
hex = "0.4.3"
lazy_static = "1.5.1"
num-traits = "0.2.19"
once_cell = "1.21.4"
opi-core = { path = "../opi-core" }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
rust-embed = "8.13.0"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
serde_with = "3.24.0"
sha256 = "1.6.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "bigdecimal", "time", "tls-rustls"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync"] }
tracing = "0.1.44"
versions = "8.0.1"
