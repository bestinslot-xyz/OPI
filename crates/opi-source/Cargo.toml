[package]
name = "opi-source"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
bitcoin = { version = "0.32.5", features = ["serde"] }
clap = "4"
hex = "0.4"
log = "0.4"
opi-core = { path = "../opi-core" }
ord = "=0.29.1"
ordinals = "=0.0.17"
postcard = { version = "1", features = ["alloc", "use-std"] }
redb = "=3.1.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zstd = "0.14"

[features]
# Synthetic journal contents for tests and measurements.
testing = []

[dev-dependencies]
opi-source = { path = ".", features = ["testing"] }
mockcore = { git = "https://github.com/ordinals/ord", tag = "0.29.1" }
rand = "0.10"
tempfile = "3"
