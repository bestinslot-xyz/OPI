[package]
name = "opi-indexer"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
bitcoin = "0.32.5"
brc20-prog = "0.16.6"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
jsonrpsee = { version = "0.26", features = ["server"] }
opi-api = { path = "../opi-api" }
opi-bitmap = { path = "../opi-bitmap" }
opi-brc20 = { path = "../opi-brc20" }
opi-core = { path = "../opi-core" }
opi-runes = { path = "../opi-runes" }
opi-runtime = { path = "../opi-runtime" }
opi-sns = { path = "../opi-sns" }
opi-source = { path = "../opi-source" }
ord = "=0.29.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1.92"
