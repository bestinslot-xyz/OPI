[package]
name = "opi-runtime"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
futures = "0.3"
opi-core = { path = "../opi-core" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
