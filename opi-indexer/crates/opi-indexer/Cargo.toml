[package]
name = "opi-indexer"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
bitcoin = "0.32.5"
brc20-index = { path = "../../../modules/brc20_index" }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
log = "0.4"
opi-core = { path = "../opi-core" }
opi-source = { path = "../opi-source" }
ord = { git = "https://github.com/ordinals/ord", tag = "0.23.2" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
