[package]
name = "opi-indexer"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
bitcoin = "0.32.5"
brc20-index = { path = "../../../modules/brc20_index" }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
opi-core = { path = "../opi-core" }
opi-runtime = { path = "../opi-runtime" }
opi-source = { path = "../opi-source" }
ord = "=0.29.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
