[package]
name = "opi-indexer"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
bitcoin = "0.32.5"
brc20-index = { path = "../../../modules/brc20_index" }
clap = { version = "4", features = ["derive"] }
db_reader = { path = "../../../ord/db_reader", default-features = false }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4.3"
jsonrpsee = { version = "0.26.0", features = ["client", "http-client", "tokio"] }
log = "0.4"
opi-core = { path = "../opi-core" }
opi-source = { path = "../opi-source" }
ord = { git = "https://github.com/ordinals/ord", tag = "0.29.1" }
redb = "=3.1.3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
