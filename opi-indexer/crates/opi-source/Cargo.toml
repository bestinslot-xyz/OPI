[package]
name = "opi-source"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
bitcoin = { version = "0.32.5", features = ["serde"] }
clap = "4"
hex = "0.4"
log = "0.4"
opi-core = { path = "../opi-core" }
ord = { git = "https://github.com/ordinals/ord", tag = "0.23.2" }
ordinals = { git = "https://github.com/ordinals/ord", tag = "0.23.2" }
postcard = { version = "1", features = ["alloc", "use-std"] }
redb = "=2.5.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"

[dev-dependencies]
mockcore = { git = "https://github.com/ordinals/ord", tag = "0.23.2" }
rand = "0.8"
tempfile = "3"
